# What this package declares about itself.
#
# The declaration is capability, not intent: the package's own suite compares it
# with what the code calls, because `aru doctor` reads the application and never
# opens an installed package.

name = "hyz-is/ticket"
framework = ">= 0.66"
profiles = ["conventional", "performance"]

[permissions]
# It answers requests and reads its own rows. Nothing leaves the process: an
# e-mail is the application's Notifier's to send, and the package sends none.
network = false
# It opens no file of its own. The attachments go to the Disk the application
# passes in Config.Files -- in production a private bucket -- under keys the
# server generates, and are read back only through an authorized route.
filesystem = false
# It runs no other program.
exec = false
# migrations.go owns four tables, so whoever installs this has to run
# `aru migrate`. Declaring it is how they find that out before deploying.
migrations = true
